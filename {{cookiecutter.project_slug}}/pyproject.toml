[project]
name = "{{ cookiecutter.project_slug }}"
version = "{{ cookiecutter.version }}"
description = "{{ cookiecutter.project_short_description }}"
authors = [
    { name = "{{ cookiecutter.full_name }}", email = "{{ cookiecutter.email }}" }
]
license = { text = "{{ cookiecutter.open_source_license }}" }
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
dynamic = ["dependencies", "classifiers"]

[project.urls]
Homepage = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.project_slug }}"
Repository = "https://github.com/{{ cookiecutter.github_username }}/{{ cookiecutter.project_slug }}"
{% if cookiecutter.document_publisher == 'ReadTheDocs' %}
Documentation = "https://{{ cookiecutter.project_slug | replace("_", "-") }}.readthedocs.io"
{% else %}
Documentation = "https://{{ cookiecutter.github_username }}.github.io/{{ cookiecutter.project_slug }}"
{%- endif %}

{% if cookiecutter.command_line_interface|lower == 'click' %}
[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.project_slug }}.cli:main"
{% endif %}

[tool.poetry]
requires-poetry = ">=2.0"
packages = [
    { include = "{{ cookiecutter.project_slug }}" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
{%- if cookiecutter.command_line_interface|lower == 'click' %}
click = "^8.1.7"{%- endif %}
{% if cookiecutter.use_onacol == "y" -%}
onacol = "^0.3.4"{%- endif %}
{% if cookiecutter.use_classic_aiohttp_setup == "y" -%}
aiohttp = "^3.9.0"
sockjs = "^0.11.0"{% endif %}

[tool.poetry.group.dev.dependencies]
bump-my-version = "^1.2.0"
pip = "^24.0"
wheel = "^0.42.0"
watchdog = "^4.0.0"
tox = "^4.34.0"
coverage = {extras = ["toml"], version = "^7.4"}
Sphinx = "^8.1.0"
sphinx-rtd-theme = "^3.0"
myst-parser = "^5.0.0"
twine = "^5.0"
ruff = "^0.14.0"
{% if cookiecutter.use_pytest == "y" -%}
pytest = "^9.0"
pytest-runner = "^6.0"
pytest-cov = "^4.1"{% endif %}
mypy = "^1.19"

[tool.coverage.run]
omit = [".*", "*/site-packages/*"]
source = ["{{ cookiecutter.project_slug }}"]
relative_files = true

[tool.coverage.report]
fail_under = 100

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.bumpversion]
current_version = "{{ cookiecutter.version }}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "{{ cookiecutter.project_slug }}/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
