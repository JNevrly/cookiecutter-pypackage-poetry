image: python:{{ cookiecutter.python_version }}

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

before_script:
  - pip install poetry
  - poetry config virtualenvs.in-project true
  - poetry install -vv

stages:
  - test
  - lint
  - deploy

test:
  stage: test
  script:
    - poetry run pytest --cov={{ cookiecutter.project_slug }} tests/

lint:
  stage: lint
  script:
    - poetry run ruff check .
    - poetry run ruff format --check .
    - poetry run mypy {{ cookiecutter.project_slug }}

deploy:
  stage: deploy
  script:
    - poetry publish --build -u $PYPI_USERNAME -p $PYPI_PASSWORD
  only:
    - tags
